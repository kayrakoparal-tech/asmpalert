name: Build Fabric Mod
on:
  workflow_dispatch:
  push:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/unzip@v3
        with:
          zipFile: asmpalerts-1.21.8-fabric-project.zip
          dest: unpacked
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.14'
      - run: gradle -p unpacked/asmp-dramatic-alerts build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: "unpacked/**/build/libs/*-1.0.0.jar"
